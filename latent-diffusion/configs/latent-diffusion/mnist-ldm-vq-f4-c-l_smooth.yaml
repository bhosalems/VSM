
model:
  base_learning_rate: 1.0e-4
  target: ldm.models.diffusion.ddpm.LatentDiffusion
  params:
    linear_start: 0.0015
    linear_end: 0.0195
    num_timesteps_cond: 1
    log_every_t: 200
    timesteps: 1000
    first_stage_key: image
    cond_stage_key: caption
    add_head: true
    image_size: 64
    channels: 3
    cond_stage_trainable: false
    conditioning_key: crossattn
    ocm_dpm: false
    learn_sigma: true
    var_type: LearnedRange
    rho: 0.1
    # monitor: val/loss_simple_ema
    monitor: val/loss
    use_ema: false
    scheduler_config:
      target: ldm.lr_scheduler.LambdaLinearScheduler
      params:
        warm_up_steps:
        - 1000
        cycle_lengths:
        - 10000000000000
        f_start:
        - 1.0e-06
        f_max:
        - 1.0
        f_min:
        - 1.0
    unet_config:
      target: ldm.modules.diffusionmodules.openaimodel.UNetModel
      params:
        image_size: 64
        in_channels: 3
        out_channels: 3
        model_channels: 192
        attention_resolutions: [8, 4, 2]
        num_res_blocks: 2
        channel_mult: [ 1,2,3,5 ]
        num_heads: 1
        use_spatial_transformer: True
        transformer_depth: 1
        context_dim: 512
        ckpt_path: /home/csgrad/mbhosale/phd/Pathdiff/PathLDM/models/ldm/cin256-v2/unet.ckpt
    first_stage_config:
      target: ldm.models.autoencoder.VQModelInterface
      params:
        embed_dim: 3
        n_embed: 8192
        ckpt_path: /home/csgrad/mbhosale/phd/Pathdiff/PathLDM/models/first_stage_models/vq-f4/model.ckpt
        ddconfig:
          double_z: false
          z_channels: 3
          resolution: 256
          in_channels: 3
          out_ch: 3
          ch: 128
          ch_mult:
          - 1
          - 2
          - 4
          num_res_blocks: 2
          attn_resolutions: []
          dropout: 0.0
        lossconfig:
          target: torch.nn.Identity
    cond_stage_config:
      target: ldm.modules.encoders.modules.FrozenCLIPEmbedder
      params:
        # this is base clip model
        # using this allows us to fine-tune imagenet ldm unet
        version: "openai/clip-vit-base-patch32"
        max_length: 154
data:
  target: main.DataModuleFromConfig
  params:
    batch_size: 64
    num_workers: 12
    wrap: false
    train:
      target: ldm.data.mnist.MNISTDataset
      params:
        config:
          root: "/data_local1/mbhosale/Diffhaul/mnist"
          split: train
          crop_size: 256
          inference: False
          p_uncond: 0.1
    validation:
      target: ldm.data.mnist.MNISTDataset
      params:
        config:
          root: "/data_local1/mbhosale/Diffhaul/mnist/"
          split: test
          crop_size: 256
          inference: False
lightning:
  callbacks:
    image_logger:
      target: main.ImageLogger
      params:
        batch_frequency: 1000
        max_images: 8
        increase_log_steps: False
  trainer:
    benchmark: True
    accumulate_grad_batches: 2
    accelerator: ddp
    gpus: -1