model:
  base_learning_rate: 0.00001
  target: ldm.models.diffusion.ddpm.LatentDiffusion
  params:
    linear_start: 0.0015
    linear_end: 0.0195
    num_timesteps_cond: 1
    log_every_t: 200
    timesteps: 1000
    first_stage_key: image
    cond_stage_key: caption
    ocm_dpm: false
    # learn_sigma: true
    var_type: LearnedRange
    # add_head: true #<--- Adds new head for the sigma prediction in conditional training with pretrained unconditional unet weights
    image_size: 64
    channels: 3
    # rho: 0.1
    cond_stage_trainable: false
    conditioning_key: crossattn
    monitor: val/loss
    use_ema: false
    scheduler_config:
      target: ldm.lr_scheduler.LambdaLinearScheduler
      params:
        warm_up_steps:
        - 1000
        cycle_lengths:
        - 10000000000000
        f_start:
        - 1.0e-06
        f_max:
        - 1.0
        f_min:
        - 1.0
    unet_config:
      target: ldm.modules.diffusionmodules.openaimodel.UNetModel
      params:
        image_size: 64
        in_channels: 3
        out_channels: 3
        model_channels: 192
        attention_resolutions:
        - 8
        - 4
        - 2
        num_res_blocks: 2
        channel_mult:
        - 1
        - 2
        - 3
        - 5
        num_heads: 1
        use_spatial_transformer: true
        transformer_depth: 1
        context_dim: 512
        ckpt_path: /home/csgrad/mbhosale/phd/ddpm_hallucination/halmin/latent-diffusion/logs/2025-09-19T20-07-46_hands-ldm-vq-f4-c/checkpoints/epoch=000166.ckpt
    first_stage_config:
      target: ldm.models.autoencoder.VQModelInterface
      params:
        embed_dim: 3
        n_embed: 8192
        ckpt_path: /home/csgrad/mbhosale/phd/Pathdiff/PathLDM/models/first_stage_models/vq-f4/model.ckpt
        ddconfig:
          double_z: false
          z_channels: 3
          resolution: 256
          in_channels: 3
          out_ch: 3
          ch: 128
          ch_mult:
          - 1
          - 2
          - 4
          num_res_blocks: 2
          attn_resolutions: []
          dropout: 0.0
        lossconfig:
          target: torch.nn.Identity
    cond_stage_config:
      target: ldm.modules.encoders.modules.FrozenCLIPEmbedder
      params:
        version: openai/clip-vit-base-patch32
        max_length: 154
data:
  target: main.DataModuleFromConfig
  params:
    batch_size: 32
    num_workers: 12
    wrap: false
    train:
      target: ldm.data.hands.HANDSDataset
      params:
        config:
          root: /data_local1/mbhosale/Diffhaul/Hands/all
          split: train
          crop_size: 256
          inference: false
          p_uncond: 0.1
    validation:
      target: ldm.data.hands.HANDSDataset
      params:
        config:
          root: /data_local1/mbhosale/Diffhaul/Hands/all
          split: test
          crop_size: 256
          inference: false
lightning:
  callbacks:
    image_logger:
      target: main.ImageLogger
      params:
        batch_frequency: 1000
        max_images: 8
        increase_log_steps: False
  trainer:
    benchmark: True
    accumulate_grad_batches: 2
    accelerator: ddp
    gpus: -1